name: Buscar sugestões de matérias

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-news.js
      - name: Salvar sugestões
        run: |
          git config user.name "thermcam-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/sugestoes.json
          git diff --cached --quiet || (git commit -m "Atualiza sugestões de matérias" && git push)
